name: cosecha-tableros

on:
  schedule:
    # 13:00 UTC = 08:00 Ecuador (America/Guayaquil, UTC-5, sin horario de verano)
    - cron: '0 13 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: harvest
  cancel-in-progress: true

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cosechar Lever + Ashby (APIs públicas, sin secrets)
        run: python scripts/gh/harvest_multi.py

      - name: Publicar cola actualizada (dedupe persistente)
        run: |
          git config user.name "gh-commander-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/gh/data/
          if git diff --cached --quiet; then
            echo "Sin cambios que publicar"
          else
            git commit -m "cosecha $(date -u +%F): cola Lever/Ashby actualizada"
            git push
          fi
